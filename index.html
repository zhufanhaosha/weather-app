<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFD93D">
  <meta name="description" content="每日天气、课程表、新闻、运势一站式查询">
  <title>天气查询</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon-192.png">
</head>
<body>
  <div class="container">
    <!-- 天气动画层 -->
    <div class="weather-animation" id="weatherAnimation"></div>
    
    <!-- 日期和农历信息 -->
    <div class="date-section">
      <div class="date-left">
        <div class="solar-date" id="solarDate"></div>
        <div class="lunar-date" id="lunarDate"></div>
        <div class="lunar-info">
          <span class="lunar-yi" id="lunarYi"></span>
          <span class="lunar-ji" id="lunarJi"></span>
        </div>
      </div>
      <div class="date-right">
        <div class="poem-section" id="poemSection">
          <div class="poem-title">📖 每日一诗</div>
          <div class="poem-content" id="poemContent">加载中...</div>
        </div>
      </div>
    </div>
    
    <!-- 星座运势区域 -->
    <div class="horoscope-section" id="horoscopeSection">
      <div class="horoscope-item" id="horoscope-scorpio">
        <div class="horoscope-sign">♏ 天蝎座</div>
        <div class="horoscope-luck" id="luck-scorpio">加载中...</div>
      </div>
      <div class="horoscope-item" id="horoscope-pisces">
        <div class="horoscope-sign">♓ 双鱼座</div>
        <div class="horoscope-luck" id="luck-pisces">加载中...</div>
      </div>
      <div class="horoscope-item" id="horoscope-gemini">
        <div class="horoscope-sign">♊ 双子座</div>
        <div class="horoscope-luck" id="luck-gemini">加载中...</div>
      </div>
    </div>
    
    <h1>🌤️ 天气查询</h1>
    
    <!-- 生日提醒区域 -->
    <div class="birthday-section">
      <!-- 左侧：玩偶 -->
      <div class="photo-box left-photo">
        <img src="birthday.jpg" alt="玩偶">
      </div>
      
      <!-- 中间：生日提醒 -->
      <div class="birthday-reminders">
        <div class="birthday-item chuchu-birthday">
          <div class="birthday-info">
            <span class="birthday-label">楚楚生日</span>
            <span class="birthday-days" id="chuchuDays"></span>
          </div>
        </div>
        <div class="birthday-item mumu-birthday">
          <div class="birthday-info">
            <span class="birthday-label">沐沐生日</span>
            <span class="birthday-days" id="mumuDays"></span>
          </div>
        </div>
      </div>
      
      <!-- 右侧：皮卡丘 -->
      <div class="photo-box right-photo">
        <img src="pikachu.jpg" alt="皮卡丘">
      </div>
    </div>
    
    <!-- 搜索框 -->
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="输入城市名...">
      <button id="searchBtn">查询</button>
    </div>
    
    <!-- 快捷城市 -->
    <div class="quick-cities">
      <button data-city="石家庄">石家庄</button>
      <button data-city="北京">北京</button>
      <button data-city="上海">上海</button>
      <button data-city="广州">广州</button>
      <button data-city="深圳">深圳</button>
    </div>
    
    <!-- 主内容 -->
    <div class="main-content" id="mainContent" style="display:none;">
      <!-- 左侧：天气 -->
      <div class="left-panel">
        <div id="weatherDisplay" class="weather-display">
          <div class="city-name" id="cityName"></div>
          <div class="weather-icon" id="weatherIcon"></div>
          <div class="temperature" id="temperature"></div>
          <div class="description" id="description"></div>
          <div class="details">
            <div class="detail-item"><span>💧 湿度</span><span id="humidity"></span></div>
            <div class="detail-item"><span>💨 风速</span><span id="windSpeed"></span></div>
            <div class="detail-item"><span>🌡️ 体感</span><span id="feelsLike"></span></div>
          </div>
        </div>
        
        <div class="forecast-section">
          <h3>📅 15天趋势</h3>
          <div id="forecastList" class="forecast-list"></div>
        </div>
      </div>
      
      <!-- 右侧：课程表 + 新闻 -->
      <div class="right-panel">
        <!-- 课程表 -->
        <div class="schedule-section">
          <h3>📚 课程表</h3>
          <div class="schedule-table">
            <table>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>星期一</th>
                  <th>星期二</th>
                  <th>星期三</th>
                  <th>星期四</th>
                  <th>星期五</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="period">第1节</td>
                  <td>班队会</td>
                  <td>数学</td>
                  <td>语文</td>
                  <td>数学</td>
                  <td>语文</td>
                </tr>
                <tr>
                  <td class="period">第2节</td>
                  <td>数学</td>
                  <td>语文</td>
                  <td>数学</td>
                  <td>语文</td>
                  <td>数学</td>
                </tr>
                <tr>
                  <td class="period">第3节</td>
                  <td>美术</td>
                  <td>体育</td>
                  <td>阅读</td>
                  <td>体育</td>
                  <td>体育</td>
                </tr>
                <tr>
                  <td class="period">第4节</td>
                  <td>围棋</td>
                  <td>语文</td>
                  <td>音乐</td>
                  <td>科学</td>
                  <td>道德与法治</td>
                </tr>
                <tr>
                  <td class="period">第5节</td>
                  <td>语文</td>
                  <td>道德与法治</td>
                  <td>体育</td>
                  <td>综合实践</td>
                  <td>阅读</td>
                </tr>
                <tr>
                  <td class="period">第6节</td>
                  <td>写字</td>
                  <td>科学</td>
                  <td>劳动与技能</td>
                  <td>语文</td>
                  <td>音乐</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        
        <!-- 新闻 -->
        <div class="news-section">
          <h3>📰 国际新闻</h3>
          <div id="newsList" class="news-list">
            <div class="loading">加载中...</div>
          </div>
        </div>
      </div>
    </div>
    
    <div id="errorMessage" class="error-message" style="display:none;"></div>
  </div>
  
  <script src="app.js"></script>
  <script>
    // 注册 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered:', registration);
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
