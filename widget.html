<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFD93D">
  <meta name="description" content="天气生日小部件">
  <title>天气生日</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #FFE4E1 0%, #FFF8DC 50%, #E0FFFF 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    /* 天气卡片 */
    .weather-card {
      text-align: center;
    }
    
    .weather-city {
      font-size: 13px;
      color: #888;
      margin-bottom: 5px;
    }
    
    .weather-temp {
      font-size: 42px;
      font-weight: bold;
      color: #333;
      line-height: 1;
    }
    
    .weather-icon {
      font-size: 48px;
      margin: 5px 0;
    }
    
    .weather-desc {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    
    .weather-date {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }
    
    /* 生日卡片 */
    .birthday-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
    }
    
    .birthday-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .birthday-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .birthday-info {
      display: flex;
      flex-direction: column;
    }
    
    .birthday-name {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }
    
    .birthday-date {
      font-size: 11px;
      color: #888;
    }
    
    .birthday-countdown {
      text-align: right;
    }
    
    .birthday-days {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    
    .birthday-unit {
      font-size: 11px;
      color: #888;
    }
    
    .today-badge {
      background: #FF6B6B;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 2px;
      display: inline-block;
    }
    
    /* 楚楚 - 粉色 */
    .chuchu { background: linear-gradient(135deg, #ffdde1 0%, #ffb6c1 100%); }
    
    /* 沐沐 - 蓝色 */
    .mumu { background: linear-gradient(135deg, #a8edea 0%, #b8e6f0 100%); }
    
    /* 刷新按钮 */
    .refresh-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFD93D, #FF6B6B);
      border: none;
      color: white;
      font-size: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .refresh-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <!-- 天气卡片 -->
  <div class="card weather-card">
    <div class="weather-city" id="cityName">石家庄</div>
    <div class="weather-temp" id="temperature">--°</div>
    <div class="weather-icon" id="weatherIcon">🌤️</div>
    <div class="weather-desc" id="weatherDesc">加载中...</div>
    <div class="weather-date" id="weatherDate"></div>
  </div>
  
  <!-- 楚楚生日 -->
  <div class="card birthday-card chuchu">
    <div class="birthday-left">
      <div class="birthday-avatar">🧸</div>
      <div class="birthday-info">
        <span class="birthday-name">楚楚生日</span>
        <span class="birthday-date">6月5日</span>
      </div>
    </div>
    <div class="birthday-countdown">
      <span id="chuchuDays" class="birthday-days">--</span>
      <span class="birthday-unit">天后</span>
      <span id="chuchuToday" class="today-badge" style="display:none">🎂 今天!</span>
    </div>
  </div>
  
  <!-- 沐沐生日 -->
  <div class="card birthday-card mumu">
    <div class="birthday-left">
      <div class="birthday-avatar">⚡</div>
      <div class="birthday-info">
        <span class="birthday-name">沐沐生日</span>
        <span class="birthday-date">7月10日</span>
      </div>
    </div>
    <div class="birthday-countdown">
      <span id="mumuDays" class="birthday-days">--</span>
      <span class="birthday-unit">天后</span>
      <span id="mumuToday" class="today-badge" style="display:none">🎂 今天!</span>
    </div>
  </div>
  
  <!-- 刷新按钮 -->
  <button class="refresh-btn" onclick="refreshAll()">🔄</button>
  
  <script>
    const birthdays = {
      chuchu: { month: 6, day: 5 },
      mumu: { month: 7, day: 10 }
    };
    
    const weatherIcons = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
      45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌦️', 55: '🌧️',
      61: '🌧️', 63: '🌧️', 65: '🌧️',
      71: '🌨️', 73: '🌨️', 75: '❄️',
      95: '⛈️', 96: '⛈️', 99: '⛈️'
    };
    
    const weatherDescriptions = {
      0: '晴朗', 1: '大部晴朗', 2: '多云', 3: '阴天',
      45: '雾', 48: '雾凇',
      51: '小毛毛雨', 53: '中毛毛雨', 55: '大毛毛雨',
      61: '小雨', 63: '中雨', 65: '大雨',
      71: '小雪', 73: '中雪', 75: '大雪',
      95: '雷暴', 96: '雷暴冰雹', 99: '强雷暴冰雹'
    };
    
    function getDaysUntilBirthday(month, day) {
      const now = new Date();
      let birthday = new Date(now.getFullYear(), month - 1, day);
      if (now > birthday) {
        birthday = new Date(now.getFullYear() + 1, month - 1, day);
      }
      return Math.ceil((birthday - now) / (1000 * 60 * 60 * 24));
    }
    
    function updateDate() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      document.getElementById('weatherDate').textContent = `${month}月${day}日 ${weekdays[now.getDay()]}`;
    }
    
    function updateBirthdays() {
      const now = new Date();
      const cm = now.getMonth() + 1;
      const cd = now.getDate();
      
      const chuchuDays = getDaysUntilBirthday(6, 5);
      document.getElementById('chuchuDays').textContent = chuchuDays;
      if (cm === 6 && cd === 5) {
        document.getElementById('chuchuDays').textContent = '🎂';
        document.getElementById('chuchuToday').style.display = 'inline';
      }
      
      const mumuDays = getDaysUntilBirthday(7, 10);
      document.getElementById('mumuDays').textContent = mumuDays;
      if (cm === 7 && cd === 10) {
        document.getElementById('mumuDays').textContent = '🎂';
        document.getElementById('mumuToday').style.display = 'inline';
      }
    }
    
    async function loadWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.04&longitude=114.51&current=temperature_2m,weather_code&timezone=Asia/Shanghai');
        const data = await res.json();
        document.getElementById('temperature').textContent = `${Math.round(data.current.temperature_2m)}°`;
        document.getElementById('weatherDesc').textContent = weatherDescriptions[data.current.weather_code] || '晴';
        document.getElementById('weatherIcon').textContent = weatherIcons[data.current.weather_code] || '🌤️';
      } catch (err) {
        console.error('天气加载失败', err);
      }
    }
    
    function refreshAll() {
      updateDate();
      updateBirthdays();
      loadWeather();
    }
    
    // 初始化
    refreshAll();
    
    // 自动刷新（每30分钟）
    setInterval(refreshAll, 30 * 60 * 1000);
  </script>
</body>
</html>
