<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFD93D">
  <title>生日倒计时</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .title {
      color: white;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 30px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    
    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
    }
    
    .card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
    }
    
    .chuchu .avatar {
      background: linear-gradient(135deg, #ffdde1, #ffb6c1);
    }
    
    .mumu .avatar {
      background: linear-gradient(135deg, #a8edea, #b8e6f0);
    }
    
    .info {
      flex: 1;
    }
    
    .name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }
    
    .date {
      font-size: 13px;
      color: #888;
    }
    
    .countdown {
      text-align: right;
    }
    
    .days {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      line-height: 1;
    }
    
    .days-label {
      font-size: 12px;
      color: #888;
    }
    
    .today {
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      color: white;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .weather {
      margin-top: 25px;
      background: rgba(255,255,255,0.9);
      border-radius: 15px;
      padding: 15px 25px;
      text-align: center;
      width: 100%;
      max-width: 320px;
    }
    
    .weather-city {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }
    
    .weather-temp {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }
    
    .weather-desc {
      font-size: 13px;
      color: #888;
      margin-top: 3px;
    }
    
    .weather-icon {
      font-size: 24px;
    }
    
    .refresh-hint {
      margin-top: 20px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="title">🎂 生日倒计时</div>
  
  <div class="cards">
    <!-- 楚楚 -->
    <div class="card chuchu">
      <div class="avatar">🧸</div>
      <div class="info">
        <div class="name">楚楚生日</div>
        <div class="date">6月5日</div>
      </div>
      <div class="countdown">
        <div id="chuchuDays" class="days">--</div>
        <div class="days-label">天后</div>
        <div id="chuchuToday" class="today" style="display:none">🎉 今天!</div>
      </div>
    </div>
    
    <!-- 沐沐 -->
    <div class="card mumu">
      <div class="avatar">⚡</div>
      <div class="info">
        <div class="name">沐沐生日</div>
        <div class="date">7月10日</div>
      </div>
      <div class="countdown">
        <div id="mumuDays" class="days">--</div>
        <div class="days-label">天后</div>
        <div id="mumuToday" class="today" style="display:none">🎉 今天!</div>
      </div>
    </div>
  </div>
  
  <!-- 天气 -->
  <div class="weather">
    <div class="weather-city" id="weatherCity">石家庄</div>
    <div class="weather-icon" id="weatherIcon">🌤️</div>
    <div class="weather-temp" id="weatherTemp">--°</div>
    <div class="weather-desc" id="weatherDesc">加载中...</div>
  </div>
  
  <div class="refresh-hint">点击刷新获取最新数据</div>
  
  <script>
    const weatherIcons = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
      45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌦️', 55: '🌧️',
      61: '🌧️', 63: '🌧️', 65: '🌧️',
      95: '⛈️', 96: '⛈️', 99: '⛈️'
    };
    
    const weatherDesc = {
      0: '晴朗', 1: '大部晴朗', 2: '多云', 3: '阴天',
      45: '雾', 48: '雾凇',
      51: '小毛毛雨', 53: '中毛毛雨', 55: '大毛毛雨',
      61: '小雨', 63: '中雨', 65: '大雨',
      95: '雷暴', 96: '雷暴冰雹', 99: '强雷暴冰雹'
    };
    
    function updateCountdowns() {
      const now = new Date();
      const cm = now.getMonth() + 1;
      const cd = now.getDate();
      
      // 楚楚 - 6月5日
      const chuchuDays = getDaysUntil(6, 5);
      document.getElementById('chuchuDays').textContent = chuchuDays;
      if (cm === 6 && cd === 5) {
        document.getElementById('chuchuDays').style.display = 'none';
        document.getElementById('chuchuToday').style.display = 'block';
      }
      
      // 沐沐 - 7月10日
      const mumuDays = getDaysUntil(7, 10);
      document.getElementById('mumuDays').textContent = mumuDays;
      if (cm === 7 && cd === 10) {
        document.getElementById('mumuDays').style.display = 'none';
        document.getElementById('mumuToday').style.display = 'block';
      }
    }
    
    function getDaysUntil(month, day) {
      const now = new Date();
      let birthday = new Date(now.getFullYear(), month - 1, day);
      if (now > birthday) {
        birthday = new Date(now.getFullYear() + 1, month - 1, day);
      }
      return Math.ceil((birthday - now) / (1000 * 60 * 60 * 24));
    }
    
    async function loadWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.04&longitude=114.51&current=temperature_2m,weather_code&timezone=Asia/Shanghai');
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;
        
        document.getElementById('weatherTemp').textContent = `${temp}°`;
        document.getElementById('weatherDesc').textContent = weatherDesc[code] || '晴';
        document.getElementById('weatherIcon').textContent = weatherIcons[code] || '🌤️';
      } catch (err) {
        console.error('天气加载失败', err);
      }
    }
    
    function refresh() {
      updateCountdowns();
      loadWeather();
    }
    
    document.body.addEventListener('click', refresh);
    refresh();
    
    // 每30分钟自动刷新
    setInterval(refresh, 30 * 60 * 1000);
  </script>
</body>
</html>
